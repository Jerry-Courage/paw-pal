services:
  # ─── BACKEND WEB SERVICE ────────────────────────────────────────────────────
  - type: web
    name: paw-pal-backend
    env: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "bash start.sh"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paw-pal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paw-pal-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.1"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: PAYSTACK_MODE
        value: "live"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ─── AI WORKER SERVICE ──────────────────────────────────────────────────────
  - type: worker
    name: paw-pal-worker
    env: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "python manage.py qcluster"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paw-pal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paw-pal-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.1"
      - key: ALLOWED_HOSTS
        value: "*"

  # ─── CRON: DAILY SUBSCRIPTION DEACTIVATION ──────────────────────────────────
  - type: cron
    name: paw-pal-cron
    env: python
    plan: starter
    buildCommand: "./build.sh"
    schedule: "0 0 * * *"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paw-pal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paw-pal-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.1"
      - key: ALLOWED_HOSTS
        value: "*"
    startCommand: "python manage.py deactivate_expired_subscriptions && python manage.py send_expiry_reminders"

  # ─── FRONTEND WEB SERVICE ───────────────────────────────────────────────────
  - type: web
    name: paw-pal-frontend
    env: node
    plan: starter
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    rootDir: frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: paw-pal-backend
          property: hostWithScheme
          suffix: /api
      - key: API_URL
        fromService:
          type: web
          name: paw-pal-backend
          property: hostWithScheme
          suffix: /api
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: paw-pal-frontend
          property: hostWithScheme
      - key: NEXTAUTH_SECRET
        generateValue: true

  # ─── REDIS (FOR CHANNELS / TASKS) ───────────────────────────────────────────
  - type: redis
    name: paw-pal-redis
    plan: starter
    ipAllowList: [] 

databases:
  - name: paw-pal-db
    plan: starter
